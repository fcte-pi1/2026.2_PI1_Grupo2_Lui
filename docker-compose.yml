services:
  postgres:
    image: postgres:18.6
    container_name: micromouse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: micromouse
      POSTGRES_USER: micromouse
      POSTGRES_PASSWORD: micromouse_dev

    ports:
      - "5432:5432"

    volumes:
      - micromouse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micromouse -d micromouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  micromouse_postgres_data: