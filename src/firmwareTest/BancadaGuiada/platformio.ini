[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -I ../../firmware/src

[env:native]
platform = native
test_build_src = no
build_flags = -I src
test_filter = test_turn_yaw
