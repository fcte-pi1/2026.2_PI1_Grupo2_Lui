[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
build_flags =
    -std=gnu++17
    -I ../../firmware/src

lib_deps =
    bblanchon/ArduinoJson@7.4.3
