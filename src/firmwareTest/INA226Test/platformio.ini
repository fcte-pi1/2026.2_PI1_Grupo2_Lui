[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Se o shunt fisico confirmado for 0.01 ohm, adicione a build_flags:
; -DINA226_TEST_SHUNT_RESISTANCE_OHMS=0.01f
; -DINA226_TEST_MAX_EXPECTED_CURRENT_A=5.0f
build_flags =
    -std=gnu++17
    -I ../common
    -I ../../firmware/include
    -I ../../firmware/src/hal
