[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
upload_speed = 115200
build_flags =
    -std=gnu++17
    -I src
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; Ambiente de testes nativos: mapa, navegação, percepção,
[env:native]
platform = native
extra_scripts = pre:scripts/native_coverage.py
test_build_src = yes

build_flags =
    -std=gnu++17
    -I include
    -I src
    --coverage
    -g
    -O0

build_src_filter =
    -<*>

    ; HU-00 e HU-03: mapa e navegação autônoma
    +<navigation/MazeMap.cpp>
    +<navigation/MazeSolver.cpp>
    +<navigation/AutonomousNavigator.cpp>
    +<navigation/MazeMissionController.cpp>

    ; HU-01 e HU-02: percepção e rastreamento
    +<navigation/PositionTracker.cpp>
    +<navigation/WallPerception.cpp>
    +<navigation/RobotStateEstimator.cpp>

    ; HU-11 e HU-12: sessões e diagnósticos
    +<communication/Logger.cpp>
    +<navigation/SessionBuffer.cpp>
    +<navigation/SessionRecorder.cpp>
    +<navigation/SessionCoordinator.cpp>
    +<hal/LittleFsSessionStorage.cpp>

test_filter =
    test_maze_map
    test_maze_solver
    test_autonomous_navigator
    test_maze_mission_controller
    test_position_tracker
    test_wall_perception
    test_robot_state_estimator
    test_logger
    test_session_buffer
    test_session_recorder
    test_session_coordinator
    test_tracking_adapter
    test_snapshot_wall_sensor


; Deterministic tests exercise the real integrated controller and motor driver.
[env:motion_native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -I test/test_calibrated_motion/stubs
    -I src
build_src_filter =
    -<*>
    +<control/motion_controller.cpp>
    +<control/odometry.cpp>
    +<control/pid_controller.cpp>
    +<hal/motor_drv8833.cpp>
    +<hal/ultrasonic_us100.cpp>
test_filter = test_calibrated_motion

; Explicit bench test authorized with wheels suspended and motor battery OFF.
; Same navigation firmware; only enables receiving remote starts.
[env:esp32dev_remote_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DMM_REMOTE_MOTION_ENABLED=1
    -DMM_BT_DEVICE_NAME=\"MicroMouse_BT_Test\"
