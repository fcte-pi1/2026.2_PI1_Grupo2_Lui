[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.11.2
    ESP32Async/AsyncTCP@3.5.0
    links2004/WebSockets@^2.6.1

; Ambiente de testes nativos: mapa, navegação, percepção,
[env:native]
platform = native
test_build_src = yes

build_flags =
    -std=gnu++17
    -I include
    -I src
    --coverage
    -lgcov
    -g
    -O0

build_src_filter =
    -<*>

    ; HU-00 e HU-03: mapa e navegação autônoma
    +<navigation/MazeMap.cpp>
    +<navigation/MazeSolver.cpp>
    +<navigation/AutonomousNavigator.cpp>
    +<navigation/MazeMissionController.cpp>

    ; HU-01 e HU-02: percepção e rastreamento
    +<navigation/PositionTracker.cpp>
    +<navigation/WallPerception.cpp>
    +<navigation/RobotStateEstimator.cpp>

    ; HU-11 e HU-12: sessões e diagnósticos
    +<communication/Logger.cpp>
    +<navigation/SessionBuffer.cpp>
    +<navigation/SessionRecorder.cpp>
    +<navigation/SessionCoordinator.cpp>
    +<hal/LittleFsSessionStorage.cpp>

test_filter =
    test_maze_map
    test_maze_solver
    test_autonomous_navigator
    test_maze_mission_controller
    test_position_tracker
    test_wall_perception
    test_robot_state_estimator
    test_logger
    test_session_buffer
    test_session_recorder
    test_session_coordinator
    test_tracking_adapter
