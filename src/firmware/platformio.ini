[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.11.2
    ESP32Async/AsyncTCP@3.5.0

; Ambiente de teste nativo (host, sem ESP32) — permite testar a lógica de
; firmware com Unity, sem hardware. Não altera o [env:esp32dev] acima.
; Exclui main.cpp (depende de Arduino.h, que não existe no host).
; percepção (HU-01) com Unity, sem hardware. Não altera o [env:esp32dev]
; acima. Exclui main.cpp (depende de Arduino.h, que não existe no host).
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
build_src_filter =
    +<*>
    -<main.cpp>