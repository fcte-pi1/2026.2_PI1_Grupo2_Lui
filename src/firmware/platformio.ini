[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.11.2
    ESP32Async/AsyncTCP@3.5.0

; Ambiente de teste nativo (host, sem ESP32). Compila apenas a lógica HU-11/HU-12,
; sem incluir fontes de outras HUs/hardware ainda não integradas neste branch.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -I include
build_src_filter =
    -<*>
    +<communication/Logger.cpp>
    +<navigation/SessionBuffer.cpp>
    +<navigation/SessionRecorder.cpp>
    +<navigation/SessionCoordinator.cpp>
    +<hal/LittleFsSessionStorage.cpp>
test_filter = test_logger test_session_buffer test_session_recorder test_session_coordinator
